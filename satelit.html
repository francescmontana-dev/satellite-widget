<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Satèl·lit Meteosat</title>

<style>
body{
  margin:0;
  background:#0b1220;
  color:white;
  font-family:Arial, sans-serif;
  text-align:center;
}
.card{
  max-width:900px;
  margin:auto;
  padding:10px;
}
h2{
  margin:8px 0 4px;
  font-size:22px;
}
.subtitle{
  color:#cfd8dc;
  font-size:13px;
  margin-bottom:8px;
}
.tabs{
  display:flex;
  gap:6px;
  justify-content:center;
  flex-wrap:wrap;
  margin:8px 0;
}
button{
  border:0;
  border-radius:20px;
  padding:8px 12px;
  background:#263954;
  color:white;
  cursor:pointer;
  font-size:14px;
}
button.active{
  background:#1e88e5;
}
.video{
  position:relative;
  width:100%;
  padding-bottom:56.25%;
  height:0;
  overflow:hidden;
  border-radius:12px;
  background:#000;
  box-shadow:0 0 12px rgba(0,0,0,.45);
}
.video iframe{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  border:0;
}
.info{
  font-size:12px;
  color:#b0bec5;
  margin-top:8px;
  line-height:1.4;
}
</style>
</head>

<body>
<div class="card">

<h2>🛰️ Satèl·lit Meteosat</h2>
<div class="subtitle" id="subtitle">Earth View Europe · Meteosat-12</div>

<div class="tabs">
  <button id="btn-europe" class="active" onclick="setStream('europe')">Europa</button>
  <button id="btn-africa" onclick="setStream('africa')">Àfrica</button>
  <button id="btn-atlantic" onclick="setStream('atlantic')">Atlàntic</button>
  <button id="btn-eumetview" onclick="setStream('eumetview')">EUMETView</button>
</div>

<div class="video">
  <iframe
    id="satFrame"
    src="https://www.youtube.com/embed/nigtvuOspmM?autoplay=1&mute=1&rel=0"
    title="EUMETSAT Earth View"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
    allowfullscreen>
  </iframe>
</div>

<div class="info" id="info">
  Font oficial: EUMETSAT Earth View · Actualització aproximada cada 10 minuts · Retard aproximat de 30 minuts · Horari UTC
</div>

</div>

<script>
const frame = document.getElementById("satFrame");
const subtitle = document.getElementById("subtitle");
const info = document.getElementById("info");

const streams = {
  europe: {
    title: "Earth View Europe · Meteosat-12",
    url: "https://www.youtube.com/embed/nigtvuOspmM?autoplay=1&mute=1&rel=0",
    info: "Font oficial: EUMETSAT Earth View Europe · Actualització aproximada cada 10 minuts · Retard aproximat de 30 minuts · Horari UTC"
  },
  africa: {
    title: "Earth View Africa · Meteosat-12",
    url: "https://www.eumetsat.int/real-time-imagery/earth-view",
    info: "Obre la pàgina oficial d’EUMETSAT Earth View per seleccionar el directe d’Àfrica."
  },
  atlantic: {
    title: "Earth View Atlantic · Meteosat-12",
    url: "https://www.eumetsat.int/real-time-imagery/earth-view",
    info: "Obre la pàgina oficial d’EUMETSAT Earth View per seleccionar el directe de l’Atlàntic."
  },
  eumetview: {
    title: "EUMETView · visor oficial de capes",
    url: "https://view.eumetsat.int",
    info: "EUMETView permet consultar capes oficials: natural colour, infraroig, airmass, dust i vapor d’aigua."
  }
};

function setStream(type){
  frame.src = streams[type].url;
  subtitle.textContent = streams[type].title;
  info.textContent = streams[type].info;

  document.querySelectorAll("button").forEach(b => b.classList.remove("active"));
  document.getElementById("btn-" + type).classList.add("active");
}
</script>

</body>
</html>
